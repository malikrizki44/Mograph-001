
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mograph 10 Seconds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="video" id="video">

    <div class="background"></div>
    <div class="overlay"></div>

    <div class="top">
        <span>VISUAL PROJECT</span>
        <span>2026 / 001</span>
    </div>

    <div class="image-container">
        <img src="foto.jpg" id="photo">
    </div>

    <div class="glow"></div>

    <div class="content">
        <p class="subtitle">DISCOVER SOMETHING NEW</p>
        <h1 id="title">YOUR<br>STORY.</h1>
        <div class="line"></div>
        <p class="description">A MOMENT WORTH REMEMBERING</p>
    </div>

    <div class="bottom">
        <span>CREATIVE MOTION</span>
        <span>10 SECONDS</span>
    </div>

    <div class="progress">
        <div id="bar"></div>
    </div>

</div>

<div class="controls">
    <button onclick="playAnimation()">PLAY AGAIN</button>
    <button onclick="recordVideo()">EXPORT VIDEO</button>
</div>

<script src="script.js"></script>
</body>
</html>
